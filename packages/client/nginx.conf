server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # PWA: never cache service worker and manifest
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /workbox-*.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # NOTE: the frontend calls the API directly via VITE_API_URL
    # (baked at build time, e.g. http://<EC2-IP>:3001/api), so no /api/
    # proxy is needed here. CORS is handled by the backend (CORS_ORIGIN).

    # Static assets - long cache (hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
