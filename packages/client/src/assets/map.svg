      <path d="M96 92 h25 v18 h-25z"/>
      <path d="M144 91 h39 v22 h-39z"/>
      <path d="M196 92 h29 v19 h-29z"/>
      <path d="M247 89 h35 v18 h-35z"/>
      <path d="M294 88 h29 v21 h-29z"/>
      <path d="M24 118 h22 v17 h-22z"/>
      <path d="M72 126 h35 v20 h-35z"/>
      <path d="M121 125 h28 v16 h-28z"/>
      <path d="M169 126 h39 v21 h-39z"/>
      <path d="M224 124 h33 v18 h-33z"/>
