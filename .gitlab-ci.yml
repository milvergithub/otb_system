stages:
  - build

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/packages/client:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/packages/server:$CI_COMMIT_SHORT_SHA

build-frontend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -f packages/client/Dockerfile -t "$FRONTEND_IMAGE" .
    - docker push "$FRONTEND_IMAGE"

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -f packages/server/Dockerfile -t "$BACKEND_IMAGE" .
    - docker push "$BACKEND_IMAGE"